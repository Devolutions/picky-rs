[package]
name = "picky"
version = "7.0.0-rc.27"
authors = [
    "Benoît CORTIER <bcortier@devolutions.net>",
    "Jonathan Trepanier <jtrepanier@devolutions.net>",
    "François Dubois <fdubois@devolutions.net>",
    "Richard Markiewicz <rmarkiewicz@devolutions.net>",
    "Ionut Mihalcea <ionut.mihalcea@arm.com>",
    "Kim Altintop <kim@monadic.xyz>",
    "Alexandr Yusuk <aleksandr.yusuk@apriorit.com>",
    "Flavio Castelli <flavio@castelli.me>",
    "Xynnn_ <xynnn@linux.alibaba.com>",
]
description = "Portable X.509, PKI, JOSE and HTTP signature implementation."
keywords = ["x509", "jwt", "signature", "jose", "pki"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devolutions/picky-rs"
include = ["src/**/*", "README.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
picky-asn1 = { version = "0.10", path = "../picky-asn1", features = ["zeroize"] }
picky-asn1-der = { version = "0.5", path = "../picky-asn1-der" }
picky-asn1-x509 = { version = "0.15", path = "../picky-asn1-x509", features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
thiserror = "2"
byteorder = { version = "1.5", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
time = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
hex = "0.4"
http = { version = "1.4", optional = true }
cab = { version = "0.6", optional = true }
lexical-sort = { version = "0.3", optional = true }
zeroize = "1.8"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["fips"], optional = true }

# FIXME: either use ureq, or even better: do not require this kind of dependency at all to let user decide which lib to use.
# (currently users should *really* not forget to use `spawn_blocking` when calling associated functions from async context)
reqwest = { version = "0.13", default-features = false, features = ["blocking"], optional = true }

# /!\ ===== cryptography dependencies ===== /!\
# These should be updated as soon as possible.
# /!\ ===================================== /!\

rand = { version = "0.10", optional = true }
rand_core = { version = "0.10", optional = true }
crypto-bigint = { version = "0.7", optional = true }

ed25519-dalek = { version = "3", features = ["hazmat", "rand_core"], optional = true }
x25519-dalek = { version = "3", features = ["static_secrets"], optional = true }

p256 = { version = "0.14", features = ["ecdh"], optional = true }
p384 = { version = "0.14", features = ["ecdh"], optional = true }
p521 = { version = "0.14", features = ["ecdh"], optional = true }

rsa = { version = "=0.10.0-rc.18", features = ["std"], optional = true }

digest = { version = "0.11", optional = true }
md5 = { package = "md-5", version = "0.11", features = ["oid"], optional = true }
sha1 = { version = "0.11", features = ["oid"], optional = true }
sha2 = { version = "0.11", features = ["oid"], optional = true }
sha3 = { version = "0.12", features = ["oid"], optional = true }

aes-gcm = { version = "0.11", optional = true }
aes = { version = "0.9", optional = true }
aes-kw = { version = "0.3", optional = true }
argon2 = { version = "=0.6.0-rc.8", optional = true }
ctr = { version = "0.10", optional = true }
cbc = { version = "0.2", optional = true, features = ["alloc"] }
bcrypt-pbkdf = { version = "0.11", optional = true }
des = { version = "0.9", optional = true }
rc2 = { version = "0.9", optional = true }
pbkdf2 = { version = "0.13", optional = true }
hmac = { version = "0.13", optional = true }
crypto-common = { version = "0.2", optional = true }
inout = { version = "0.2.2", optional = true }

# Pin transitive dependencies versions.
# TODO: Remove when stable versions will be released.
blake2 = { version = "=0.11.0-rc.6", optional = true }
pkcs1 = { version = "=0.8.0-rc.4", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
cfg-if = "1.0"
rand_chacha = "0.10"
ring = "0.17"
rstest = "0.26"
expect-test = "1"
tempfile = "3.22"
picky-test-data = { path = "../picky-test-data", version = "0.1" }

[features]
default = ["rustcrypto", "x509", "jose", "jwe-crypto", "http_signature", "http_trait_impl", "pkcs12"]

# Crypto backends. FIPS consumers must disable default features and select
# a concrete FIPS provider explicitly.
rustcrypto = [
    "dep:rand",
    "dep:rand_core",
    "dep:crypto-bigint",
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:rsa",
    "dep:digest",
    "dep:md5",
    "dep:sha1",
    "dep:sha2",
    "dep:sha3",
    "dep:crypto-common",
    "dep:inout",
    "dep:pkcs1",
    "dep:aes-gcm",
    "dep:ctr",
    "dep:cbc",
    "dep:aes-kw",
    "dep:aes",
    "dep:des",
    "dep:rc2",
    "dep:pbkdf2",
    "dep:hmac",
    "dep:bcrypt-pbkdf",
    "picky-asn1-x509/legacy",
]
fips = []
fips-aws-lc = ["fips", "dep:aws-lc-rs"]
full = [
    "x509",
    "jose",
    "jwe-crypto",
    "http_signature",
    "pkcs12",
    "pkcs7",
    "http_timestamp",
    "ctl",
    "ctl_http_fetch",
    "wincert",
    "ssh",
    "http_trait_impl",
    "chrono_conversion",
    "time_conversion",
    "putty",
]

# main features
x509 = []
jose = ["dep:serde_json"]
jwe-crypto = ["jose"]
http_signature = []
pkcs12 = ["picky-asn1-x509/pkcs12", "x509"]

# secondary features
pkcs7 = ["x509", "picky-asn1-x509/pkcs7"]
http_timestamp = ["dep:reqwest"]
ctl = ["picky-asn1-x509/ctl", "pkcs7", "chrono_conversion"]
ctl_http_fetch = ["dep:reqwest", "dep:cab", "ctl"]
wincert = ["x509", "dep:byteorder"]
ssh = ["dep:byteorder", "dep:lexical-sort"]
http_trait_impl = ["dep:http"]
chrono_conversion = ["dep:chrono", "picky-asn1/chrono_conversion"]
time_conversion = ["dep:time", "picky-asn1/time_conversion"]
putty = ["dep:argon2", "dep:hmac", "ssh",
    # Transitive dependencies
    "dep:blake2"
]

[package.metadata.docs.rs]
# FIPS providers are mutually exclusive and require provider-specific native
# build inputs, so docs.rs builds the complete RustCrypto surface instead.
all-features = false
features = ["full"]
